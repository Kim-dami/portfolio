<script>
$(window).scroll(function() {
    if ($(window).scrollTop() > 10) {
        $('header').addClass('scroll');
		$('.sub-menu').addClass('scroll');
    } else {
        $('header').removeClass('scroll');
		$('.sub-menu').removeClass('scroll');
    }
});

$(document).ready(function(){
	// 네비게이션
	$('ul.main-navigation li').click(function(){
		$('ul.main-navigation li').removeClass('on');
		$(this).addClass('on');
	});

	// 지역 선택
	$('ul.jobPosting-depth1 li').click(function(){
		$('ul.jobPosting-depth1 li').removeClass('on');
		$(this).addClass('on');
		$('.jobPosting-depth2 ul').css('display', 'none');
		let targetClass = $(this).attr('class').split(' ');
		targetClass.forEach(function(cls) {
			if (cls !== 'on') {
				$('.jobPosting-depth2 ul.' + cls).css('display', 'flex');
			}
		});
	});

	// 지역 선택
	$('.jobPosting-depth2 ul li').click(function(){
		$(this).siblings('li').removeClass('on');
		$(this).addClass('on');
	});
});
</script>
