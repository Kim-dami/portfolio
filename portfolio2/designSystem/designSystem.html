<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>디자인시스템 UIUX 커스텀</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <link rel="stylesheet" type="text/css" href="css/default.css">
    <link rel="shortcut icon" href="../assets/img/favicon.ico">
    <link rel="apple-touch-icon" href="../assets/img/iphone_icon.png">
    <style>
        /*---------- 커스텀 영역 ----------*/
        .areaCustom{position: fixed; top: 0; right: 520px; bottom: 0; left: 0; z-index: 100; background-color: #F0F0F0; padding: 20px; box-sizing: border-box;}

        /* 라디오 & 체크박스 */
        .setCustom{position: relative; width: 100%; height: auto;}
        .setCustom .inputCustom{position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; width: 100%; height: 100%; opacity: 0;}
        .setCustom .labelCustom{display: block; position: relative; width:100%; height: auto;}
        .setCustom .labelCustom .text{position: relative; width: 100%; height: auto; line-height: 20px; margin-bottom: 12px;; padding-left: 28px; box-sizing: border-box; font-size: 16px;}

        .setCustom .labelCustom svg{position: absolute; top: 0; left: 0; width: 20px; height: 20px;}

        .setCustom .labelCustom .iconSquare rect{fill: #FFFFFF; stroke: #D0D0D0; stroke-linejoin: round; stroke-linecap: round; stroke-width: 1.5px;}
        .setCustom .labelCustom .iconSquare path{fill: #FFFFFF; stroke: none;}
        .setCustom .inputCustom:checked + .labelCustom .iconSquare rect{fill: #2f63ff; stroke: #2f63ff;}
        .setCustom .inputCustom:checked + .labelCustom .iconSquare path{fill: #FFFFFF;}
        .setCustom .inputCustom:disabled + .labelCustom .iconSquare rect{fill: #D0D0D0; stroke: #D0D0D0;}
        .setCustom .inputCustom:disabled + .labelCustom .iconSquare path{fill: #D0D0D0;}

        .setCustom .labelCustom .iconTwoCircles rect{fill: none;}
        .setCustom .labelCustom .iconTwoCircles .outline{fill: #FFFFFF; stroke: #D0D0D0;}
        .setCustom .labelCustom .iconTwoCircles .inline{fill: none;}
        .setCustom .inputCustom:checked + .labelCustom .iconTwoCircles .outline{fill: #FFFFFF; stroke: #2f63ff;}
        .setCustom .inputCustom:checked + .labelCustom .iconTwoCircles .inline{fill: #2f63ff;}

        /* 헤더 검색 */
        .areaCustom h1{margin-bottom: 16px;}
        .areaCustom .ulHeaderSearch{position: relative; width: 100%; height: auto; display: flex; flex-direction: row; flex-wrap: wrap; align-items: flex-start; justify-content: flex-start;}
        .areaCustom .liHeaderSearch{position: relative; height: auto; display: flex; margin-right: 40px;}


        /*---------- 결과 영역 ----------*/
        .areaResult{position: fixed; top: 0; right: 0; bottom: 0; width: 520px; background-color: #F0F0F0;;}

        /* 헤더 */
        .areaResult header{position: absolute; top: 20px; right: 20px; left: 20px; z-index: 100; width: 480px; height: 60px;; background-color: #FFFFFF; box-shadow: 0 1px 4px rgba(0,0,0,8%);;}
        .areaResult header h1{display: flex; flex-direction: row; flex-wrap: nowrap; align-content: center; justify-content: space-between; align-items: center; width: 100%; height: 60px; padding: 0 10px; box-sizing: border-box;}
        .areaResult header a{display: flex; height: 100%; padding: 5px 0; box-sizing: border-box;}
        .areaResult header a img{height: 100%; object-fit: contain;}

        /* 헤더 검색 */
        header .areaHeaderSearch{padding: 5px; box-sizing: border-box; border: 2px solid #FFFFFF; border-radius: 5px;}
        header .areaHeaderSearch:hover{border: 2px solid #cedaff; background-color: #cedaff;}

        .setSearch{position: relative; width: 240px; height: auto;}
        .setSearch .inputSearch{display: block; position: relative; width: 100%; height: 40px; font-size: 14px;}
        .setSearch .labelSearch{position: absolute; top: 0; left: 15px; line-height: 40px; color: #A0A0A0; font-size: 14px;}
        .setSearch .inputSearch:focus + .labelSearch,
        .setSearch .inputSearch:valid + .labelSearch{display: none;}
        .setSearch .btnSubmit{position: absolute; top: 50%; right: 10px; margin-top: -15px;;}
        .setSearch .iconSubmit{width: 30px; height: 30px; vertical-align: top;}

        .onlyIcon .setSearch{width: 50px; height: 40px;}
        .onlyIcon .setSearch .inputSearch{display: none;}
        .onlyIcon .setSearch .labelSearch{display: none;}
        .fullBorder .setSearch .inputSearch{width: 100%; line-height: 14px; padding: 12px 50px 12px 16px; border: 1px solid #D0D0D0; border-radius: 5px; box-sizing: border-box; background-color: #FFFFFF; font-size: 14px;}
        .underBorder .setSearch .inputSearch{line-height: 14px; padding: 13px 50px 4px 16px; border-bottom: 1px solid #000; box-sizing: border-box; background-color: #FFFFFF; font-size: 14px;}

        /* 메인 */
        .areaResult main{position: absolute; top: 70px; right: 20px; bottom: 20px; left: 20px; padding-top: 20px; box-sizing: border-box; background-color: #FFFFFF; overflow: scroll;}
    </style>
</head>
<body>
<div class="areaCustom">
    <h1>검색 UIUX 바꾸기</h1>
    <ul class="ulHeaderSearch">
        <li class="liHeaderSearch"><fieldset class="setCustom">
                <input type="radio" name="headerSearch" class="inputCustom" id="headerSearch-1" checked="" value="onlyIcon" onchange="headerSearchCustom();">
                <label for="type-1" class="labelCustom">
                    <div class="text">        
                        <svg viewBox="0 0 20 20" class="iconTwoCircles">
                            <g>
                                <rect width="20" height="20"></rect>
                                <circle cx="10" cy="10" r="9" class="outline"></circle>
                                <circle cx="10" cy="10" r="5" class="inline"></circle>
                            </g>
                        </svg>
                        검색아이콘만
                    </div>
                    <div class="preview onlyIcon">
                        <fieldset class="setSearch">
                            <input type="search" id="inputSearch" class="inputSearch" required="required" autocomplete="off">
                            <label for="inputSearch" class="labelSearch">검색어를 입력해주세요</label>
                            <button type="submit" class="btnSubmit">
                                <span class="blind">검색</span>
                                <img src="https://baedalgeek.s3.ap-northeast-2.amazonaws.com/img/icon_search-1.svg" alt="검색" class="iconSubmit"/>
                            </button>
                        </fieldset>
                    </div>
                </label>
            </fieldset>
        </li>
        <li class="liHeaderSearch">
            <fieldset class="setCustom">
                <input type="radio" name="headerSearch" class="inputCustom" id="headerSearch-2" value="fullBorder"  onchange="headerSearchCustom();">
                <label for="headerSearch-2" class="labelCustom">
                    <div class="text"> 
                        <svg viewBox="0 0 20 20" class="iconTwoCircles">
                            <g>
                                <rect width="20" height="20"></rect>
                                <circle cx="10" cy="10" r="9" class="outline"></circle>
                                <circle cx="10" cy="10" r="5" class="inline"></circle>
                            </g>
                        </svg>
                        모든 선 채워짐
                        </div>
                    <div class="preview fullBorder">
                        <fieldset class="setSearch">
                            <input type="search" id="inputSearch" class="inputSearch" required="required" autocomplete="off">
                            <label for="inputSearch" class="labelSearch">검색어를 입력해주세요</label>
                            <button type="submit" class="btnSubmit">
                                <span class="blind">검색</span>
                                <img src="https://baedalgeek.s3.ap-northeast-2.amazonaws.com/img/icon_search-1.svg" alt="검색" class="iconSubmit"/>
                            </button>
                        </fieldset>
                    </div>
                </label>
            </fieldset>
        </li>
        <li class="liHeaderSearch">
            <fieldset class="setCustom">
                <input type="radio" name="headerSearch" class="inputCustom" id="headerSearch-3" value="underBorder" onchange="headerSearchCustom();">
                <label for="headerSearch-3" class="labelCustom">
                    <div class="text"> 
                        <svg viewBox="0 0 20 20" class="iconTwoCircles">
                            <g>
                                <rect width="20" height="20"></rect>
                                <circle cx="10" cy="10" r="9" class="outline"></circle>
                                <circle cx="10" cy="10" r="5" class="inline"></circle>
                            </g>
                        </svg>
                        밑에만 선 채워짐
                    </div>
                    <div class="preview underBorder">
                        <fieldset class="setSearch">
                            <input type="search" id="inputSearch" class="inputSearch" required="required" autocomplete="off">
                            <label for="inputSearch" class="labelSearch">검색어를 입력해주세요</label>
                            <button type="submit" class="btnSubmit">
                                <span class="blind">검색</span>
                                <img src="https://baedalgeek.s3.ap-northeast-2.amazonaws.com/img/icon_search-1.svg" alt="검색" class="iconSubmit"/>
                            </button>
                        </fieldset>
                    </div>
                </label>
            </fieldset>
        </li>
    </ul>
</div>
<div class="areaResult">
    <header>
        <h1>
            <a href="#">
                <img src="https://cdn.imweb.me/thumbnail/20250729/1e2b9395a15e8.png" alt="분양의 신">
            </a>
            <butto class="areaHeaderSearch onlyIcon">
                <fieldset class="setSearch">
                    <input type="search" id="inputSearch" class="inputSearch" required="required" autocomplete="off">
                    <label for="inputSearch" class="labelSearch">검색어를 입력해주세요</label>
                    <button type="submit" class="btnSubmit">
                        <span class="blind">검색</span>
                        <img src="https://baedalgeek.s3.ap-northeast-2.amazonaws.com/img/icon_search-1.svg" alt="검색" class="iconSubmit"/>
                    </button>
                </fieldset>
            </butto>
        </h1>
    </header>
    <main>
    </main>
</div>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
<script>
    const swiperTimebelt = new Swiper('.swiperTimebelt', {
        slidesPerView: "auto",
    });

    const swiperFilter = new Swiper('.swiperFilter', {
        slidesPerView: "auto",
    });

    const swiperDiscount = new Swiper('.swiperDiscount', {
        autoplay: {
            delay: 3000,
            disableOnInteraction: false,
        },
    });

    window.onload = function() {
        document.querySelector('.areaLocationCheck').classList.add('visible');
        setTimeout(function (){
            document.querySelector('.areaLocationCheck').classList.remove('visible');
        },3000);
    }



    function headerSearchCustom(){
        let design = ['onlyIcon', 'fullBorder', 'underBorder']
        var selectResult = document.querySelector('.areaResult .areaHeaderSearch');
        var selectedRadio = document.querySelector('input[name="headerSearch"]:checked');
        if (selectedRadio) {
            var selectedValue = selectedRadio.value;
            console.log('선택된 디자인은 : ', selectedValue);

            for (let i = 0; i < design.length; i ++) {
                if(design[i] == selectedValue){
                    selectResult.classList.add(design[i]);
                    console.log(design[i]);
                } else {
                    selectResult.classList.remove(design[i]);
                }
            }

        }
    }

    window.onload = function(){
        headerSearchCustom();
    }
</script>
</body>
</html>
