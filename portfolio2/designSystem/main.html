<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>UI·UX 디자인 메인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" type="text/css" href="css/default.css">
    <link rel="stylesheet" type="text/css" href="css/component.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <link rel="shortcut icon" href="../assets/img/favicon.ico">
    <link rel="apple-touch-icon" href="../assets/img/iphone_icon.png">
</head>
<body>
<div class="bgAdperson">
    <header>
        <h2>분양의신 어플, 내가 만들어볼게요!</h2>
        <h1>보기 좋고 쓰기 좋게, UI·UX 디자인</h1>
    </header>
    <main class="mainStep">
        <ol class="olMainStep">
            <li class="liMainStep">
                <a href="levelTest.html" class="linkMainStep">
                    <p class="step">STEP 01</p>
                    <div class="subTitle">
                        <span>UI·UX 디자인은 무엇일까</span>
                    </div>
                    <div class="title">
                        <span>UI·UX<br />레벨테스트</span>
                    </div>
                    <div class="start default">START</div>
                </a>
            </li>
            <li class="liMainStep">
                <a href="#" class="linkMainStep">
                    <p class="step">STEP 02</p>
                    <div class="subTitle">
                        <span>디자인시스템 적용하기</span>
                    </div>
                    <div class="title">
                        <span>분양의신<br />어플 만들기</span>
                    </div>
                    <div class="start disable">START</div>
                </a>
            </li>
        </ol>
    </main>
</div>
<script>
    window.onload = function(){
        var subTitle = document.querySelectorAll('.mainStep .linkMainStep .subTitle');
        var title = document.querySelectorAll('.mainStep .linkMainStep .title');
        for (let i = 0; i < subTitle.length; i ++) {
            subTitle[i].classList.add('visible');
            title[i].classList.add('visible');
        }
    }
</script>
</body>
</html>
